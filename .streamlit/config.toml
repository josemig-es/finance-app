# Visual theme of the app (dark, minimal, matte greys + one accent)
[theme]
base = "dark"
primaryColor = "#38a596"
backgroundColor = "#141517"
secondaryBackgroundColor = "#1c1d20"
textColor = "#d9d9d6"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Only this computer can open the app (not other devices on the same Wi-Fi)
address = "127.0.0.1"
